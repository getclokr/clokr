<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Issue #975: runs before the first paint so no light flash happens on a dark device; the stores
         take over on hydration. hooks.server.ts adds the CSP nonce to this tag. Only allow-listed
         literals reach setAttribute; no network, no other DOM write. -->
    <script id="clokr-look">
      (function () {
        var root = document.documentElement;
        var mode = null;
        var theme = null;
        try {
          mode = localStorage.getItem("mode");
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme === "pflaume" || theme === "salz" || theme === "petrol") {
          root.setAttribute("data-theme", theme);
        }
        if (mode !== "light" && mode !== "dark") {
          mode = "light";
          try {
            if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
              mode = "dark";
            }
          } catch (e) {}
        }
        root.setAttribute("data-mode", mode);
      })();
    </script>
    <meta name="theme-color" content="#faf8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17141a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clokr" />
    <link rel="preload" href="/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
